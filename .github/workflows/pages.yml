name: Publish site
run-name: ${{ inputs.snapshot_id != '' && format('Publish CMS {0}', inputs.snapshot_id) || 'Site build' }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: CMS publication identifier
        type: string
        required: false
      publish:
        description: Publish this CMS snapshot through Vercel
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download published CMS snapshot
        if: vars.CMS_CONTENT_RELEASE != '' || inputs.snapshot_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CMS_RELEASE_TAG: ${{ vars.CMS_CONTENT_RELEASE || 'cms-content' }}
        run: |
          snapshot_id="$(jq -r '.inputs.snapshot_id // ""' "$GITHUB_EVENT_PATH")"
          manifest=current.json
          if [ -n "$snapshot_id" ]; then
            [[ "$snapshot_id" =~ ^[a-f0-9]{32}$ ]] || exit 1
            manifest="snapshot-$snapshot_id.json"
          fi
          mkdir -p .cache/cms-download .cache/cms-public
          gh release download "$CMS_RELEASE_TAG" --pattern "$manifest" --dir .cache/cms-download
          metadata=".cache/cms-download/$manifest"
          content_id="$(jq -er '.id | select(test("^[a-f0-9]{32}$"))' "$metadata")"
          archive="$(jq -er '.archive | select(type == "string")' "$metadata")"
          checksum="$(jq -er '.sha256 | select(test("^[a-f0-9]{64}$"))' "$metadata")"
          [ "$archive" = "snapshot-$content_id.tar.gz" ] || exit 1
          [ -z "$snapshot_id" ] || [ "$snapshot_id" = "$content_id" ] || exit 1
          gh release download "$CMS_RELEASE_TAG" --pattern "$archive" --dir .cache/cms-download
          printf '%s  %s\n' "$checksum" ".cache/cms-download/$archive" | sha256sum --check --status
          tar --extract --gzip --file ".cache/cms-download/$archive" --directory .cache/cms-public \
            --no-same-owner --no-same-permissions
          echo 'CMS_SNAPSHOT_PATH=.cache/cms-public' >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: npm install --global npm@11.20.0 --ignore-scripts
      - run: npm ci --ignore-scripts
        env:
          HUSKY: '0'
      - run: npm run browser:install
      - run: npm run check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          ASTRO_BASE: /
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: new2-site
          path: dist
          include-hidden-files: true

  publish:
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish &&
      (inputs.snapshot_id != '' || vars.CMS_CONTENT_RELEASE != ''))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: new2-site
          path: .cache/site/dist
      - name: Publish generated files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq --null-input '{framework:null,buildCommand:"",installCommand:"",outputDirectory:"dist"}' \
            > .cache/site/vercel.json
          actor_id="$(gh api "users/$GITHUB_ACTOR" --jq .id)"
          [[ "$actor_id" =~ ^[0-9]+$ ]] || exit 1
          export GIT_AUTHOR_NAME="$GITHUB_ACTOR"
          export GIT_AUTHOR_EMAIL="$actor_id+$GITHUB_ACTOR@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          cd .cache/site
          git init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config credential.helper '!gh auth git-credential'
          remote_ref=refs/heads/codex/cms-published-site
          parent="$(git ls-remote origin "$remote_ref" | cut -f1)"
          if [ -n "$parent" ]; then
            git fetch --no-tags --depth=1 origin "$remote_ref"
            parent="$(git rev-parse FETCH_HEAD)"
          fi
          git add dist vercel.json
          tree="$(git write-tree)"
          if [ -n "$parent" ]; then
            commit="$(printf 'Publish generated site for %s\n' "$GITHUB_SHA" | git commit-tree "$tree" -p "$parent")"
          else
            commit="$(printf 'Publish generated site for %s\n' "$GITHUB_SHA" | git commit-tree "$tree")"
          fi
          git push origin "$commit:$remote_ref"
