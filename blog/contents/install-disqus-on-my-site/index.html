v><div class="notebook-heading"><h1>Disqusを設置したよ!</h1></div></header><div class="notebook-body"><p>これまで、ブログへのコメントサービスに<a href="https://giscus.app/ja"><img class="external-link-favicon" src="https://icons.duckduckgo.com/ip3/giscus.app.ico" alt="" width="16" height="16" loading="lazy" decoding="async" referrerpolicy="no-referrer">Giscus<span class="external-link-tail" aria-hidden="true"><svg class="external-link-mark" viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"><path vector-effect="non-scaling-stroke" d="M5.5 2.5h-4v8h8v-4M7.5 1.5h3v3m0-3L5 7"/></svg></span></a>をブログサイトに設置していました。
本日、同コメントサービスの<a href="https://disqus.com/"><img class="external-link-favicon" src="https://icons.duckduckgo.com/ip3/disqus.com.ico" alt="" width="16" height="16" loading="lazy" decoding="async" referrerpolicy="no-referrer">Disqus<span class="external-link-tail" aria-hidden="true"><svg class="external-link-mark" viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"><path vector-effect="non-scaling-stroke" d="M5.5 2.5h-4v8h8v-4M7.5 1.5h3v3m0-3L5 7"/></svg></span></a>に切り替えました。</p>
<p>Giscusの場合、GitHubアカウントが必須だったのですが、DisqusならGoogleやXなどのアカウントでも可能となるからです。
これで、非エンジニアでもコメントできるようになります！はろー！</p>
